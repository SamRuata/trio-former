# Render.com blueprint for the TrioFormer API.
# New -> Blueprint -> point at this repo. The two secrets are set in the
# dashboard after the first deploy.
#
# Two decisions here exist because of the free tier's 512 MB and 0.1 CPU.
#
# 1. Weights are downloaded during BUILD, not on the first request. Render's
#    build filesystem carries into the running service, so the first call pays
#    only to load from disk instead of pulling ~900 MB over the network on a
#    tenth of a CPU.
#
# 2. MODEL_DTYPE is bfloat16. PyTorch alone is roughly 250 MB resident; a
#    float32 distilbert adds another 265 MB and the container is killed.
#    bfloat16 halves every weight tensor and keeps the real checkpoints,
#    which is worth more than the small accuracy cost.
#
# The MODEL_* ids are variables rather than constants so that a checkpoint
# that still will not fit can be swapped from the dashboard without a commit.
services:
  - type: web
    name: trio-former-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r api/requirements.txt &&
      python -c "from transformers import pipeline;
      pipeline('fill-mask', model='distilbert-base-uncased');
      pipeline('text-generation', model='distilgpt2');
      pipeline('summarization', model='t5-small');
      print('weights cached')"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      # Keeps tokenizers from spawning threads it cannot use on 0.1 CPU.
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MODEL_BERT
        value: distilbert-base-uncased
      - key: MODEL_GPT2
        value: distilgpt2
      - key: MODEL_T5
        value: t5-small
      # float32 does not fit beside torch