# Runs the test suite on every push and pull request.
#
# The transformer tests are pure torch and need no credentials, so CI
# exercises the hand-written block in full. The Supabase tests skip without
# secrets rather than fail, and the model tests are marked slow and excluded
# -- CI should not download 900 MB of weights on every commit.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q -m "not slow"

      - name: Verify the block still matches torch.nn
        run: |
          python -c "
          from src.benchmark import build_pair, parity
          p = parity(*build_pair())
          print(f\"max |diff| {p['max_abs_diff']:.3e}\")
          assert p['allclose_1e5'], 'hand-written block diverged from torch.nn'
          "