# Render.com blueprint for the TrioFormer API.
# New -> Blueprint -> point at this repo. The two secrets are set in the
# dashboard after the first deploy.
#
# Three decisions here exist because of the free tier's 512 MB and 0.1 CPU.
#
# 1. Weights are downloaded during BUILD, not on the first request. Render's
#    build filesystem carries into the running service, so the first call pays
#    only to load from disk instead of pulling ~900 MB over the network.
#
# 2. MODEL_DTYPE is bfloat16. PyTorch alone is roughly 250 MB resident; a
#    float32 distilbert adds another 265 MB and the container is killed.
#
# 3. Generation is capped hard. One forward pass costs about five seconds on
#    0.1 CPU, and a decoder needs one pass PER TOKEN, sequentially -- forty
#    tokens is over three minutes and times out. Eight is what fits.
services:
  - type: web
    name: trio-former-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r api/requirements.txt &&
      python -c "from transformers import pipeline;
      pipeline('fill-mask', model='distilbert-base-uncased');
      pipeline('text-generation', model='distilgpt2');
      pipeline('summarization', model='t5-small');
      print('weights cached')"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MODEL_BERT
        value: distilbert-base-uncased
      - key: MODEL_GPT2
        value: distilgpt2
      - key: MODEL_T5
        value: t5-small
      - key: MODEL_DTYPE
        value: bfloat16
      # 0.1 CPU: each generated token is a full forward pass of roughly five
      # seconds. Eight tokens is about the most that completes in a request.
      - key: MAX_NEW_TOKENS_CAP
        value: "8"
      - key: T5_MAX_LENGTH_CAP
        value: "24"